<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Originless</title>
  <meta name="description" content="Originless — content-addressed file uploads over IPFS in a single container.">
  <style>
    :root { color-scheme: light; --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --accent:#007aff; --border:#d2d2d7; --radius:14px; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:720px; margin:0 auto; padding:2rem 1rem 4rem; }
    h1 { font-size:2.25rem; margin:0 0 .25rem; letter-spacing:-.02em; }
    .lede { color:var(--muted); margin:0 0 1.5rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:1.25rem; margin-bottom:1rem; }
    .row { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
    button { cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--text); padding:.5rem .875rem; border-radius:999px; font:inherit; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    #dropzone { border:2px dashed var(--border); border-radius:var(--radius); padding:2.5rem 1rem; text-align:center; color:var(--muted); cursor:pointer; transition:border-color .15s, background .15s; }
    #dropzone.drag { border-color:var(--accent); background:#eef5ff; color:var(--text); }
    #upload-status { margin-top:.75rem; color:var(--muted); font-size:.9rem; }
    ul.history { list-style:none; padding:0; margin:.75rem 0 0; }
    ul.history li { padding:.625rem 0; border-top:1px solid var(--border); font-size:.9rem; word-break:break-all; }
    .gh { display:inline-flex; align-items:center; gap:.5rem; color:var(--text); text-decoration:none; font-weight:600; }
    .stats { font-size:.875rem; color:var(--muted); }
    .stats strong { color:var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>Originless</h1>
    <p class="lede">Content-addressed file uploads over IPFS in a single container.</p>

    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <a class="gh" href="https://github.com/besoeasy/originless" target="_blank" rel="noopener noreferrer">GitHub: besoeasy/originless</a>
        <button id="refresh">Refresh stats</button>
      </div>
      <p class="stats" id="stats">Loading stats…</p>
      <p class="stats" id="health">Node: checking…</p>
    </div>

    <div class="card">
      <div id="dropzone">Drop files or folders here, or click to select</div>
      <input id="file-input" type="file" multiple hidden>
      <input id="folder-input" type="file" webkitdirectory directory multiple hidden>
      <div class="row" style="margin-top:.75rem;">
        <button id="pick-files" type="button">Choose files</button>
        <button id="pick-folder" type="button">Choose folder</button>
      </div>
      <div id="upload-status"></div>
      <ul class="history" id="upload-history"></ul>
    </div>
  </main>

  <script>
    const refreshBtn = document.getElementById("refresh");
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("file-input");
    const folderInput = document.getElementById("folder-input");
    const pickFiles = document.getElementById("pick-files");
    const pickFolder = document.getElementById("pick-folder");
    const uploadStatus = document.getElementById("upload-status");
    const uploadHistory = document.getElementById("upload-history");
    const statsEl = document.getElementById("stats");
    const healthEl = document.getElementById("health");
    function formatBytes(bytes) {
      if (!bytes) return "0 B";
      const units = ["B", "KiB", "MiB", "GiB", "TiB"];
      let value = Number(bytes);
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit += 1; }
      return `${value.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
    }

    async function checkHealth() {
      const start = performance.now();
      try {
        const res = await fetch("/healthz", { cache: "no-store" });
        const latency = Math.round(performance.now() - start);
        if (res.ok) {
          healthEl.textContent = `Node: healthy · ${latency}ms`;
        } else {
          healthEl.textContent = "Node: degraded";
        }
      } catch (_) {
        healthEl.textContent = "Node: unavailable";
      }
    }

    async function loadStats() {
      refreshBtn.disabled = true;
      try {
        const res = await fetch("/stats", { cache: "no-store", headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error(`Stats request failed (${res.status})`);
        const data = await res.json();
        const size = data.SizeStat || {};
        statsEl.innerHTML = `Objects: <strong>${Number(data.NumObjects || 0).toLocaleString()}</strong> · Stored: <strong>${formatBytes(size.RepoSize)}</strong>` + (size.StorageMax ? ` of ${formatBytes(size.StorageMax)}` : "");
      } catch (err) {
        statsEl.textContent = "Stats unavailable";
      } finally {
        refreshBtn.disabled = false;
      }
    }

    async function uploadFiles(files) {
      const list = Array.from(files);
      uploadStatus.textContent = `Uploading ${list.length} file(s)…`;
      const hasFolder = list.some((f) => f.webkitRelativePath && f.webkitRelativePath.includes("/"));
      const endpoint = hasFolder ? "/upf" : "/up";
      const formData = new FormData();
      for (const f of list) formData.append("file", f, f.webkitRelativePath || f.name);
      try {
        const res = await fetch(endpoint, { method: "POST", body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Upload failed (${res.status})`);
        uploadStatus.textContent = "";
        const li = document.createElement("li");
        li.textContent = `${data.name || "file"} — ${data.cid} (${formatBytes(data.bytes || data.size)})`;
        uploadHistory.prepend(li);
        loadStats();
      } catch (err) {
        uploadStatus.textContent = "Upload failed: " + err.message;
      }
    }

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("drag"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
    dropzone.addEventListener("drop", (e) => { e.preventDefault(); dropzone.classList.remove("drag"); if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });
    fileInput.addEventListener("change", () => { if (fileInput.files.length) uploadFiles(fileInput.files); });
    folderInput.addEventListener("change", () => { if (folderInput.files.length) uploadFiles(folderInput.files); });
    if (pickFiles) pickFiles.addEventListener("click", () => fileInput.click());
    if (pickFolder) pickFolder.addEventListener("click", () => folderInput.click());
    refreshBtn.addEventListener("click", () => { loadStats(); checkHealth(); });

    loadStats();
    checkHealth();
  </script>
  <!-- Shared Canvas Signed Chat -->
</body>
</html>
